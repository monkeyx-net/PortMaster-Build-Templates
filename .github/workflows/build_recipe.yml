name: PortMaster - Build Recipe v01
run-name: PortMaster - ${{ inputs.recipe_file }} ${{ inputs.more_recipes }}

on:
  workflow_dispatch:
    inputs:
      MultiStageBuild:
        description: 'Run PortMaster Update'
        type: choice
        options: ['Update_Port', 'New_Port']
        default: 'Update_Port'
      recipe_file:
        description: 'Select port'
        required: true
        type: choice
        options:
          # recipe-list-start (generated by recipes/templates/scripts/update_recipe_list.sh)
          - 'animalcrossing'
          - 'ddnet'
          - 'defendguin'
          - 'epiphany'
          - 'frozenbubble'
          - 'ghostship'
          - 'harmonist'
          - 'legoisland'
          - 'lighthouse'
          - 'lix'
          - 'manicminer'
          - 'nookery'
          - 'onsyuri'
          - 'opengolf'
          - 'opensgolf'
          - 'paperboat'
          - 'pikifen'
          - 'recwars'
          - 'shamogu'
          - 'sip2'
          - 'soh'
          - 'soh2'
          - 'spaghettikart'
          - 'starship'
          - 'stuntcarracer'
          - 'thelegendofedgar'
          # recipe-list-end
      more_recipes:
        description: 'More ports to build with it (space or comma separated, e.g. "soh starship")'
        required: false
        default: ''
        type: string
      sdl_version:
        description: 'Enter SDL Version required'
        required: true
        default: '2.32.0'
      force_rebuild:
        description: 'Force rebuild of Docker images'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  packages: write
  actions: write
  checks: write

env:
  BUILD_TOKEN: ${{ secrets.BUILD_TOKEN }}
  REGISTRY: ghcr.io
  IMAGE_NAME: monkeyx-net/portmaster-build-templates/portmaster-builder

jobs:
  setup:
    name: Select ports
    runs-on: ubuntu-latest
    outputs:
      ports: ${{ steps.ports.outputs.ports }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The dropdown port plus any typed in more_recipes, each checked against recipes/ports/<port>/recipe.json
      - name: Build port list
        id: ports
        env:
          RECIPE_FILE: ${{ github.event.inputs.recipe_file }}
          MORE_RECIPES: ${{ github.event.inputs.more_recipes }}
        run: |
          ports=$(printf '%s %s' "$RECIPE_FILE" "$MORE_RECIPES" | tr ', ' '\n\n' | sed '/^$/d' | awk '!seen[$0]++')
          bad=0
          for p in $ports; do
            if [[ ! "$p" =~ ^[a-z0-9_-]+$ ]] || [ ! -f "recipes/ports/$p/recipe.json" ]; then
              echo "::error::Unknown port '$p' (no recipes/ports/$p/recipe.json)"
              bad=1
            fi
          done
          [ "$bad" = 0 ] || exit 1
          json=$(printf '%s\n' $ports | jq -R . | jq -sc .)
          echo "Ports: $json"
          echo "ports=$json" >> "$GITHUB_OUTPUT"

  build-builder-image:
    name: Build Builder Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # The arch: name needs to refer to a corresponding suffix on the .github/docker folder
          # Everything before pm_dockerfile. is ignored.  
          - arch: x86_64
            runner: ubuntu-latest
            base_image: ubuntu:24.04
            platform: linux/amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            base_image: arm64v8/ubuntu:20.04
            platform: linux/arm64
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.arch }}-latest" >> $GITHUB_OUTPUT

      - name: Check if image exists
        id: check-image
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.arch }}-latest"
          if docker buildx imagetools inspect $IMAGE_TAG > /dev/null 2>&1; then
          echo "image_exists=true" >> $GITHUB_OUTPUT
          else
          echo "image_exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Build and push builder image
        if: steps.check-image.outputs.image_exists == 'false' || github.event.inputs.force_rebuild == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .github/docker/pm_dockerfile.${{ matrix.arch }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            SDL_VERSION=${{ github.event.inputs.sdl_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build:
    name: Build ${{ matrix.port }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [setup, build-builder-image]
    strategy:
      fail-fast: false
      matrix:
        port: ${{ fromJSON(needs.setup.outputs.ports) }}
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse recipe.json and port.json
        id: parse-json
        run: |
          RECIPE_JSON_PATH="recipes/ports/${{ matrix.port }}/recipe.json"
          PORT_JSON=$(jq -r '.port_json' "$RECIPE_JSON_PATH")
          echo "port_exe=$(jq -r '.source.port_exe' "$RECIPE_JSON_PATH")" >> $GITHUB_OUTPUT
          echo "port_build=$(jq -r '.source.port_build' "$RECIPE_JSON_PATH")" >> $GITHUB_OUTPUT
          echo "port_folder=$(jq -r '.items[1]' "$PORT_JSON" | sed 's|/||g')" >> $GITHUB_OUTPUT

      - name: Fetch source
        run: recipes/templates/scripts/fetch_source.sh "${{ matrix.port }}"

      - name: Build in container (${{ matrix.arch }})
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -w /workspace \
            -e DEBIAN_FRONTEND=noninteractive \
            -e HOME=/tmp \
            --user $(id -u):$(id -g) \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.arch }}-latest \
            /bin/bash -c "
            source recipes/ports/${{ steps.parse-json.outputs.port_folder }}/build.sh \
              '${{ steps.parse-json.outputs.port_folder }}' \
              '${{ steps.parse-json.outputs.port_build }}' \
              '${{ steps.parse-json.outputs.port_exe }}' \
              '${{ matrix.arch }}'
            "

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.parse-json.outputs.port_folder }}-linux-${{ matrix.arch }}
          path: ${{ steps.parse-json.outputs.port_folder }}-linux-${{ matrix.arch }}.tar.gz
          retention-days: 7

      - name: Capture screenshot
        if: matrix.arch == 'x86_64'
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -w /workspace \
            -e DEBIAN_FRONTEND=noninteractive \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.arch }}-latest \
            recipes/templates/scripts/screenshot.sh "${{ matrix.port }}"

      - name: Upload screenshot artifact
        if: matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.parse-json.outputs.port_folder }}-linux-screenshot
          path: ${{ steps.parse-json.outputs.port_folder }}-linux-screenshot.tar.gz
          if-no-files-found: ignore
          retention-days: 7

  # One job per port. A port whose build failed on either arch fails here without stopping the others.
  package:
    name: Package ${{ matrix.port }}
    runs-on: ubuntu-latest
    needs: [setup, build]
    if: ${{ !cancelled() && needs.setup.result == 'success' && needs.build.result != 'skipped' }}
    strategy:
      fail-fast: false
      matrix:
        port: ${{ fromJSON(needs.setup.outputs.ports) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse recipe.json and port.json
        id: parse-json
        run: |
          RECIPE_JSON_PATH="recipes/ports/${{ matrix.port }}/recipe.json"
          PORT_JSON=$(jq -r '.port_json' "$RECIPE_JSON_PATH")
          echo "port_json=$PORT_JSON" >> $GITHUB_OUTPUT
          echo "port_exe=$(jq -r '.source.port_exe' "$RECIPE_JSON_PATH")" >> $GITHUB_OUTPUT
          echo "port_url=$(jq -r '.source.port_url' "$RECIPE_JSON_PATH")" >> $GITHUB_OUTPUT
          echo "port_version=$(jq -r '.source.port_version' "$RECIPE_JSON_PATH")" >> $GITHUB_OUTPUT
          echo "port_title=$(jq -r '.attr.title' "$PORT_JSON")" >> $GITHUB_OUTPUT
          echo "port_folder=$(jq -r '.items[1]' "$PORT_JSON" | sed 's|/||g')" >> $GITHUB_OUTPUT

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: ${{ steps.parse-json.outputs.port_folder }}-linux-*
          merge-multiple: true

      - name: Extract binaries to correct locations
        run: |
          for arch in x86_64 aarch64; do
            [ -f "artifacts/${{ steps.parse-json.outputs.port_folder }}-linux-${arch}.tar.gz" ] \
              || { echo "::error::No ${arch} build for ${{ matrix.port }}"; exit 1; }
          done
          PORT_EXE="${{ steps.parse-json.outputs.port_exe }}"
          PORT_FOLDER="${{ steps.parse-json.outputs.port_folder }}"
          find artifacts -type f -name "*.tar.gz" | while read f; do
            tar -xzf "$f" -C new_ports/${PORT_FOLDER}/${PORT_FOLDER}/${PORT_FOLDER}/
          done

      - name: Create missing screenshot/cover
        run: |
          PORT_DIR="$(dirname "${{ steps.parse-json.outputs.port_json }}")"
          if [ ! -f "$PORT_DIR/screenshot.png" ] && [ ! -f "$PORT_DIR/cover.png" ] && ! command -v convert > /dev/null; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends imagemagick fontconfig fonts-dejavu-core
          fi
          recipes/templates/scripts/make_images.sh "$PORT_DIR" "${{ steps.parse-json.outputs.port_title }}"

      # shared includes, version.json, controls image, check_port.sh (fails the build on errors), zip
      - name: Check and package
        run: |
          RECIPE="recipes/ports/${{ matrix.port }}/recipe.json"
          # check_port.sh --fix letterboxes/compresses screenshot.png and cover.png (pngquant, ImageMagick)
          PKGS="pngquant imagemagick"
          if jq -e '.controls' "$RECIPE" > /dev/null; then
            # make_controls.sh runs Controls4PM's converter (Lua) and exports the PNG with Inkscape
            PKGS="$PKGS inkscape lua5.4 fonts-liberation fonts-dejavu-core"
          fi
          sudo apt-get update && sudo apt-get install -y --no-install-recommends $PKGS
          recipes/templates/scripts/package.sh "${{ steps.parse-json.outputs.port_folder }}"

      - name: Commit post build changes
        run: |
          git config --local user.email "tim@monkeyx.net"
          git config --local user.name "monkeyx-net"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}
          git add new_ports/${{ steps.parse-json.outputs.port_folder }}
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add port ${{ steps.parse-json.outputs.port_title }} [$(date +%Y-%m-%d)]"
            # Other builds may push while this one runs; the commit only touches this port's folder
            for i in 1 2 3 4 5; do
              git pull --rebase && git push && break
              [ "$i" = 5 ] && exit 1
              sleep 10
            done
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PORT_FOLDER="${{ steps.parse-json.outputs.port_folder }}"
          PORT_VERSION="${{ steps.parse-json.outputs.port_version }}"
          TAG="${PORT_FOLDER}-${PORT_VERSION//:/-}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${PORT_FOLDER}.zip" --clobber
          else
            gh release create "$TAG" "${PORT_FOLDER}.zip" \
              --title "${{ steps.parse-json.outputs.port_title }} ${PORT_VERSION}" \
              --notes "Built from ${{ steps.parse-json.outputs.port_url }} (${PORT_VERSION})"
          fi

      - name: Upload PortMaster package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.parse-json.outputs.port_folder }}-portmaster
          path: ${{ steps.parse-json.outputs.port_folder }}.zip
          retention-days: 7

      - name: Show package info
        run: |
          echo "=== Package Information ==="
          echo "Port Name: ${{ steps.parse-json.outputs.port_title }}"
          echo "Port Folder: ${{ steps.parse-json.outputs.port_folder }}"
          echo "Port EXE: ${{ steps.parse-json.outputs.port_exe }}"
          echo "==========================="
